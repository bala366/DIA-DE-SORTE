name: COMPILAR APK DIA DE SORTE CAMPEAO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto Gradle
        id: projeto
        shell: bash
        run: |
          PROJECT_DIR="$(dirname "$(find . -name settings.gradle.kts -o -name settings.gradle | head -n 1)")"

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ] && [ ! -f "./settings.gradle.kts" ] && [ ! -f "./settings.gradle" ]; then
            echo "ERRO: settings.gradle.kts/settings.gradle nao encontrado"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Projeto Gradle encontrado em: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Localizar APK
        shell: bash
        run: |
          echo "APKs encontrados:"
          find . -type f -name "*.apk" -print

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: DIA-DE-SORTE-CAMPEAO-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
